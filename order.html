<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__head text-center">
          <h1>สั่งซื้อสินค้า</h1>
          <span class="title-rule" aria-hidden="true"></span>
        </div>

        <form id="orderForm" class="form-narrow">
          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" readonly>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" readonly>
          </div>

          <div class="field">
            <label for="customerName">ชื่อลูกค้า <span class="req">*</span></label>
            <input type="text" id="customerName" name="customerName" required autocomplete="name">
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line <span class="req">*</span></label>
            <input type="text" id="contact" name="contact" required autocomplete="tel">
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" rows="3"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--solid btn--block">ยืนยันคำสั่งซื้อ</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span class="brand">BODY SCENT</span>
      <span>&copy; 2026 Body Scent</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
